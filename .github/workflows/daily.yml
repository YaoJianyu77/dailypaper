name: Daily Papers

"on":
  workflow_dispatch:

permissions:
  contents: write
  models: read
  pages: write
  id-token: write

concurrency:
  group: daily-papers
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate, verify, and archive
        env:
          AI_PROVIDER: github_models
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          GITHUB_MODELS_PREFERRED_MODELS: ${{ vars.GITHUB_MODELS_PREFERRED_MODELS }}
          GITHUB_MODELS_API_BASE: ${{ vars.GITHUB_MODELS_API_BASE }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          python scripts/run_local_daily.py --enricher github_models

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
