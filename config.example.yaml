# Infrastructure example; report preferences belong only in DAILY_REPORT_PRODUCT_REQUIREMENTS.md.
site:
  title: "DailyPaper"
  base_url: ""

ai:
  provider: "github_models"
  model: "auto"
  github_models_api_base: "https://models.github.ai"
  preferred_models:
    - "openai/gpt-5.4"
    - "openai/gpt-5"
    - "openai/gpt-4.1"
    - "openai/gpt-4o"
  timeout_seconds: 240
  codex_timeout_seconds: 1200
  max_output_tokens: 16000

search:
  max_candidates_per_venue: 12
  request_interval_seconds: 1.5
  timeout_seconds: 45
  retries: 2

documents:
  max_pdf_bytes: 50000000
  max_pages: 100
  render_dpi: 150
